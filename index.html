<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIPSCHEME - Trade Live & Earn 15% Daily</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#070707;color:#fff;overflow-x:hidden}
.top{
  background:linear-gradient(90deg,#000,#111);border-bottom:2px solid #ff1a1a;
  padding:14px 16px;display:flex;justify-content:center;align-items:center;
  position:sticky;top:0;z-index:10;box-shadow:0 0 30px rgba(255,0,0,0.25)
}
.logo{font-weight:900;letter-spacing:3px;font-size:26px}
.logo .r{color:#ff1a1a}
.logo .w{color:#fff}

.hero{
  background: radial-gradient(ellipse at center, #1a0000 0%, #000 70%);
  border-bottom:2px solid #ff1a1a;
  padding:40px 16px;text-align:center;position:relative;overflow:hidden
}
.hero::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background: linear-gradient(45deg, transparent 48%, rgba(255,0,0,0.08) 50%, transparent 52%);
  background-size:200% 200%;animation:shine 3s linear infinite
}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.hero h1{font-size:34px;font-weight:900;line-height:1.1;text-shadow:0 0 20px rgba(255,0,0,0.5)}
.hero p{color:#bbb;margin-top:10px;font-size:14px}
.btns{margin-top:20px;display:flex;gap:12px;justify-content:center}
.btn-red{
  background:linear-gradient(90deg,#ff1a1a,#ff4d4d);color:#fff;border:none;
  padding:14px 28px;border-radius:14px;font-weight:900;font-size:15px;letter-spacing:1px;
  box-shadow:0 8px 25px rgba(255,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);cursor:pointer;transition:0.2s
}
.btn-red:active{transform:scale(0.95)}
.btn-outline{
  background:transparent;color:#fff;border:2px solid #ff1a1a;
  padding:12px 26px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;
  box-shadow:0 0 15px rgba(255,0,0,0.3);transition:0.2s
}
.btn-outline:hover{background:rgba(255,0,0,0.1)}

.calcWrap{
  margin:14px;background:linear-gradient(135deg,#0f0f0f,#000);border:2px solid #ff1a1a;
  border-radius:20px;padding:18px;box-shadow:0 0 40px rgba(255,0,0,0.15), inset 0 0 20px rgba(255,0,0,0.05)
}
.calcTitle{text-align:center;color:#ff3b3b;font-weight:900;font-size:18px;letter-spacing:1px;margin-bottom:14px}
.calcTitle span{filter:drop-shadow(0 0 10px #ff0000)}
.inpBox{
  background:linear-gradient(90deg,#1a1a1a,#222);border:1px solid #333;border-radius:14px;
  padding:16px;text-align:center;font-size:26px;font-weight:900;color:#fff;
  box-shadow:inset 0 2px 10px rgba(0,0,0,0.8)
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{
  background:linear-gradient(135deg,#111,#000);border:1px solid #222;border-radius:14px;
  padding:12px;text-align:center;position:relative;overflow:hidden
}
.card::after{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#ff1a1a,transparent)}
.card small{color:#777;font-size:10px;display:block;letter-spacing:1px}
.card b{font-size:17px;font-weight:900}
.green{color:#00ff66;text-shadow:0 0 10px #00ff66}
.gold{color:#ffcc00;text-shadow:0 0 10px #ffcc00}

.liveBar{
  margin:14px;background:#111;border:1px solid #222;border-radius:14px;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#aaa
}
.dot{width:8px;height:8px;background:#00ff66;border-radius:50%;display:inline-block;animation:blink 1s infinite;box-shadow:0 0 10px #00ff66}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
</style>
</head>
<body>

<div class="top"><div class="logo"><span class="r">PIP</span><span class="w">SCHEME</span></div></div>

<div class="hero">
<h1>Trade Live & Earn <span style="color:#ff1a1a">15% Daily</span></h1>
<p>Join 5,000+ traders in Kenya - M-Pesa Deposit</p>
<div class="btns">
<button class="btn-red" onclick="location.href='trading.html'">START NOW</button>
<button class="btn-outline" onclick="location.href='trading.html'">LIVE CHART</button>
</div>
</div>

<div class="liveBar"><div><span class="dot"></span> <b style="color:#fff">5,247 Traders Online</b> - Last payout 2 min ago</div><div style="color:#00ff66;font-weight:900">KSH 847,320 Paid Today</div></div>

<div class="calcWrap">
<div class="calcTitle">💰 PROFIT CALCULATOR</div>
<input class="inpBox" type="number" id="amt" value="1000" oninput="calc()">
<div class="grid">
<div class="card"><small>DAILY (15%)</small><b class="green" id="daily">KSH 150</b></div>
<div class="card"><small>WEEKLY</small><b class="green" id="weekly">KSH 1,050</b></div>
<div class="card"><small>MONTHLY</small><b class="green" id="monthly">KSH 4,500</b></div>
<div class="card"><small>TOTAL RETURN</small><b class="gold" id="total">KSH 5,500</b></div>
</div>
<button class="btn-red" style="width:100%;margin-top:14px;padding:16px;font-size:16px" onclick="location.href='trading.html'">TRADE WITH KSH <span id="btnAmt">1,000</span> →</button>
</div>

<script>
function calc(){
  let a=parseFloat(document.getElementById('amt').value)||0;
  document.getElementById('daily').innerText='KSH '+Math.round(a*0.15).toLocaleString();
  document.getElementById('weekly').innerText='KSH '+Math.round(a*0.15*7).toLocaleString();
  document.getElementById('monthly').innerText='KSH '+Math.round(a*0.15*30).toLocaleString();
  document.getElementById('total').innerText='KSH '+Math.round(a*1.15*30/7*1.5).toLocaleString();
  document.getElementById('btnAmt').innerText=a.toLocaleString();
  document.querySelector('.inpBox').value=a;
}
calc();
</script>
</body>
</html>
