<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER ADMIN - PIPSCHEME</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{background:#050505;color:#fff;font-family:Arial;padding:20px}
.login{max-width:380px;margin:80px auto;background:#111;padding:25px;border-radius:15px;border:1px solid #ff1a1a;text-align:center}
.card{background:#111;border:1px solid #222;padding:15px;border-radius:12px;margin:15px 0}
input{width:100%;padding:12px;margin:10px 0;background:#222;border:1px solid #333;border-radius:8px;color:#fff}
button{padding:8px 14px;border:none;border-radius:6px;font-weight:800;cursor:pointer}
.red{background:#ff1a1a;color:#fff}.green{background:#00c853;color:#fff}.dark{background:#333;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #222;text-align:left}
.badge{padding:3px 8px;border-radius:20px;font-size:11px}.active{background:#00c853}.disabled{background:#ff1a1a}
</style>
</head>
<body>

<div id="loginBox" class="login">
<h2 style="color:#ff1a1a">SUPER ADMIN</h2>
<p style="color:#666;font-size:12px">pipscheme.co.ke - Private</p>
<input id="pass" type="password" placeholder="Password">
<button class="red" onclick="unlock()" style="width:100%">UNLOCK</button>
<p id="err" style="color:red"></p>
</div>

<div id="dash" style="display:none">
<h1 style="color:#ff1a1a">TOTAL CONTROL <span style="font-size:12px;color:#666">admin-pips-27367432</span></h1>
<div style="display:flex;gap:10px">
<div class="card"><h2 id="total">0</h2><p>Total Users</p></div>
<div class="card"><h2 id="active" style="color:#00ff88">0</h2><p>Active</p></div>
<div class="card"><h2 id="dis" style="color:#ff4444">0</h2><p>Disabled</p></div>
</div>

<div class="card">
<h3>👥 Accounts - Fukuza / Rudisha</h3>
<table><thead><tr><th>Email</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead><tbody id="list"></tbody></table>
</div>
</div>

<script>
const ADMIN_PASS = "27367432";
const firebaseConfig={apiKey:"AIzaSyBNUbfl8OCGDsZx2aYguwn4gcmCiIjYoKQ",authDomain:"pipscheme.firebaseapp.com",projectId:"pipscheme"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function unlock(){
  if(document.getElementById('pass').value===ADMIN_PASS){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dash').style.display='block';
    load();
  }else{ document.getElementById('err').innerText="Wrong Password!"; }
}

function load(){
  db.collection('users').onSnapshot(snap=>{
    let t=snap.size,a=0,d=0,html="";
    snap.forEach(doc=>{
      const u=doc.data(); const bad=u.isDisabled===true;
      if(bad) d++; else a++;
      html+=`<tr><td>${u.email||doc.id}</td><td>KSH ${(u.balance||0)}</td><td><span class="badge ${bad?'disabled':'active'}">${bad?'DISABLED':'ACTIVE'}</span></td><td>
      ${bad?<button class="green" onclick="enableUser('${doc.id}')">ENABLE</button>:<button class="red" onclick="disableUser('${doc.id}')">DISABLE</button>}
      <button class="dark" onclick="deleteUser('${doc.id}')">DELETE</button></td></tr>`;
    });
    document.getElementById('total').innerText=t;
    document.getElementById('active').innerText=a;
    document.getElementById('dis').innerText=d;
    document.getElementById('list').innerHTML=html;
  });
}
async function disableUser(id){ if(confirm('Fukuza huyu?')){ await db.collection('users').doc(id).update({isDisabled:true}); } }
async function enableUser(id){ await db.collection('users').doc(id).update({isDisabled:false}); }
async function deleteUser(id){ if(confirm('FUTA KABISA?')){ await db.collection('users').doc(id).delete(); } }
</script>
</body>
</html>
