!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{background:#070707;color:#fff;font-family:Arial;padding:15px}input{width:100%;padding:14px;margin:10px 0;background:#222;border:1px solid #333;border-radius:10px;color:#fff}button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;background:#ff1a1a;color:#fff} .card{background:#111;padding:15px;border-radius:12px;border:1px solid #222;margin:10px 0} table{width:100%;font-size:13px} th,td{padding:8px;border-bottom:1px solid #222}</style>
</head><body>
<div id="login" style="max-width:400px;margin:100px auto;background:#111;padding:30px;border-radius:15px;border:1px solid #ff1a1a;text-align:center">
<h2 style="color:#ff1a1a">SUPER ADMIN LOGIN</h2><input id="p" type="password" placeholder="Password 27367432"><button onclick="go()">UNLOCK DASHBOARD</button><p id="e" style="color:red"></p></div>
<div id="dash" style="display:none"><h1 style="color:#ff1a1a">TOTAL CONTROL PANEL</h1>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card"><h2 id="tU">0</h2><p>Total Users</p></div><div class="card"><h2 id="tD">0</h2><p>Total Deposits</p></div></div>
<div class="card"><h3>Users - Disable / Enable</h3><table><thead><tr><th>Email</th><th>Balance</th><th>Action</th></tr></thead><tbody id="uL"></tbody></table></div>
<div class="card"><h3>Deposits</h3><table><thead><tr><th>Email</th><th>Amount</th></tr></thead><tbody id="dL"></tbody></table></div></div>
<script>
const PASS="27367432";
function go(){const v=document.getElementById('p').value.trim();if(v===PASS){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';load();}else{document.getElementById('e').innerText='Wrong! Imebaki: '+v;}}
const firebaseConfig={apiKey:"AIzaSyBNUbfl8OCGDsZx2aYguwn4gcmCiIjYoKQ",authDomain:"pipscheme.firebaseapp.com",projectId:"pipscheme"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function load(){db.collection('users').onSnapshot(s=>{document.getElementById('tU').innerText=s.size;let h="";s.forEach(d=>{const u=d.data();h+=<tr><td>${u.email||d.id}</td><td>${u.balance||0}</td><td><button onclick="dis('${d.id}')" style="padding:5px;background:#ff1a1a;width:auto">DISABLE</button> <button onclick="en('${d.id}')" style="padding:5px;background:#00c853;width:auto">ENABLE</button> <button onclick="del('${d.id}')" style="padding:5px;background:#333;width:auto">DEL</button></td></tr>});document.getElementById('uL').innerHTML=h;});db.collection('deposits').onSnapshot(s=>{let tot=0,h="";s.forEach(d=>{tot+=d.data().amount||0;h+=<tr><td>${d.data().email}</td><td>${d.data().amount}</td></tr>});document.getElementById('tD').innerText='KSH '+tot;document.getElementById('dL').innerHTML=h;});}
async function dis(id){await db.collection('users').doc(id).update({isDisabled:true});alert('Disabled');}
async function en(id){await db.collection('users').doc(id).update({isDisabled:false});alert('Enabled');}
async function del(id){if(confirm('Delete?'))await db.collection('users').doc(id).delete();}
</script></body></html>
