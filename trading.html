<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>PIPSCHEME PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{
  background: radial-gradient(ellipse at top left, #1a0a00 0%, #000000 40%, #0a001a 100%);
  min-height:100vh;color:#fff;overflow-x:hidden;position:relative
}
/* ANIMATED GLOW BACKGROUND */
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background: radial-gradient(circle at 20% 30%, rgba(255,69,0,0.15) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(138,43,226,0.15) 0%, transparent 50%),
              radial-gradient(circle at 50% 50%, rgba(255,0,80,0.08) 0%, transparent 60%);
  animation: moveGlow 15s ease-in-out infinite;z-index:-1
}
@keyframes moveGlow{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}

.top{
  backdrop-filter:blur(20px);background:rgba(20,20,20,0.7);border-bottom:1px solid rgba(255,80,0,0.3);
  display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;z-index:10
}
.logo{font-weight:900;letter-spacing:2px;color:#ff4500}
.logo span{color:#fff}
.badge{background:linear-gradient(90deg,#ff4500,#ff8c00);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900;box-shadow:0 0 15px #ff450088}
.balBox{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:8px 14px;
  backdrop-filter:blur(10px)
}
.balBox small{color:#aaa;font-size:10px;display:block}
.balBox b{color:#00ff88;font-size:16px}

.chartCard{
  margin:14px;background:rgba(15,15,15,0.8);backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.08);border-radius:20px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,69,0,0.1) inset
}
.chartHead{
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(90deg,rgba(255,69,0,0.15),transparent);border-bottom:1px solid rgba(255,255,255,0.06)
}
.liveDot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite;box-shadow:0 0 10px #00ff88}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#tv{height:420px;background:#000}

.actionBox{
  padding:16px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,rgba(20,20,20,0.9),rgba(10,10,10,0.9))
}
.stakeRow{display:flex;gap:10px}
.stakeBtn{
  flex:1;padding:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;color:#fff;text-align:center;cursor:pointer;transition:0.2s
}
.stakeBtn.active{background:linear-gradient(90deg,#ff4500,#ff8c00);border-color:#ff4500;box-shadow:0 0 20px #ff450044;color:#000;font-weight:900}

.buyBtn{
  width:100%;padding:18px;border:none;border-radius:16px;
  background:linear-gradient(90deg,#ff8c42,#ff4500);color:#fff;font-weight:900;font-size:18px;letter-spacing:1px;
  box-shadow:0 8px 25px rgba(255,69,0,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
  cursor:pointer;transition:0.2s;position:relative;overflow:hidden
}
.buyBtn:active{transform:scale(0.98)}
.sellBtn{
  width:100%;padding:16px;border:none;border-radius:16px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;
  font-weight:900;font-size:15px;cursor:pointer;backdrop-filter:blur(10px)
}

.trades{margin:14px;background:rgba(15,15,15,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:14px;backdrop-filter:blur(10px)}
.tradeItem{
  background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px;margin-top:10px;
  display:flex;justify-content:space-between;align-items:center
}
.depModal{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);
  display:none;justify-content:center;align-items:center;z-index:99
}
.depBox{
  width:90%;max-width:360px;background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:1px solid rgba(255,69,0,0.3);
  border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 40px rgba(255,69,0,0.15)
}
.inp{width:100%;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.5);color:#fff;font-size:20px;text-align:center;font-weight:900;margin:14px 0}
</style>
</head>

</div>
</div>
