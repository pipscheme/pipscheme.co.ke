<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIPSCHEME PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background: radial-gradient(ellipse at top left, #1a0a00 0%, #000000 50%, #0a001a 100%);min-height:100vh;color:#fff}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background: radial-gradient(circle at 20% 30%, rgba(255,69,0,0.18) 0%, transparent 50%),radial-gradient(circle at 80% 70%, rgba(138,43,226,0.18) 0%, transparent 50%);animation: moveGlow 15s ease-in-out infinite;z-index:-1}
@keyframes moveGlow{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
.top{backdrop-filter:blur(20px);background:rgba(20,20,20,0.75);border-bottom:1px solid rgba(255,80,0,0.35);display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:0;z-index:20}
.logo{font-weight:900;letter-spacing:2px;color:#ff4500;font-size:18px}
.badge{background:linear-gradient(90deg,#ff4500,#ff8c00);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:900;margin-left:6px}
.balBox{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:7px 12px;text-align:center}
.balBox small{color:#aaa;font-size:9px;display:block}
.balBox b{color:#00ff88;font-size:15px}
.depBtnTop{padding:10px 16px;border-radius:12px;border:none;background:#fff;color:#000;font-weight:900;cursor:pointer}
.chartCard{margin:12px;background:rgba(15,15,15,0.85);border:1px solid rgba(255,255,255,0.08);border-radius:22px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,0.7)}
.chartHead{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,rgba(255,69,0,0.18),transparent);border-bottom:1px solid rgba(255,255,255,0.06)}
.liveDot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.actionBox{padding:14px;background:#161616;display:flex;flex-direction:column;gap:12px}
.stakeRow{display:flex;gap:8px}
.stakeBtn{flex:1;padding:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:#bbb;text-align:center;cursor:pointer;font-weight:700}
.stakeBtn.active{background:linear-gradient(90deg,#ff8c42,#ff4500);border-color:#ff4500;color:#fff;transform:scale(1.05)}
.buyBtn{width:100%;padding:18px;border:none;border-radius:16px;background:linear-gradient(90deg,#ff9a5a,#ff4500);color:#fff;font-weight:900;font-size:18px;box-shadow:0 10px 28px rgba(255,69,0,0.45);cursor:pointer}
.sellBtn{width:100%;padding:15px;border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);color:#ddd;font-weight:900;font-size:14px;cursor:pointer}
.trades{margin:12px;background:rgba(15,15,15,0.75);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:14px}
.tradeItem{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.profit{color:#00ff88;font-weight:900}
.loss{color:#ff4d4d}
.depModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);backdrop-filter:blur(18px);display:none;justify-content:center;align-items:center;z-index:99}
.depBox{width:92%;max-width:360px;background:#1c1c1c;border:1px solid rgba(255,69,0,0.35);border-radius:26px;padding:24px}
.inp{width:100%;padding:16px;border-radius:14px;border:1px solid #333;background:#000;color:#fff;font-size:22px;text-align:center;font-weight:900;margin:14px 0}
</style>
</head>
<body>

<div class="top">
<div class="logo">PIPSCHEME <span class="badge">PRO</span></div>
<div class="balBox"><small>DEMO BALANCE</small><b id="bal">KSH 1,000</b></div>
<button class="depBtnTop" onclick="openDep()">+ DEPOSIT</button>
</div>

<div class="chartCard">
<div class="chartHead">
<div><span class="liveDot"></span><b id="symTxt">Euro / U.S. Dollar</b> <small style="color:#777"> • 5m • LIVE</small></div>
<div id="priceTxt" style="color:#00ff88;font-weight:900">1.12014</div>
</div>
<div style="height:55vh;min-height:400px;background:#000">
<iframe id="tvFrame" style="width:100%;height:100%;border:0" allowfullscreen></iframe>
</div>
<div class="actionBox">
<div class="stakeRow">
<div class="stakeBtn" onclick="setStake(100,this)">100</div>
<div class="stakeBtn active" onclick="setStake(1000,this)">1K</div>
<div class="stakeBtn" onclick="setStake(2500,this)">2.5K</div>
<div class="stakeBtn" onclick="setStake(5000,this)">5K</div>
</div>
<button class="buyBtn" onclick="trade('BUY')">BUY ▲</button>
<button class="sellBtn" onclick="trade('SELL')">SELL ▼</button>
<div style="display:flex;gap:8px">
<select id="symbolSel" onchange="changeSym()" style="flex:1;padding:11px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px">
<option value="FX:EURUSD">EUR/USD</option>
<option value="BINANCE:BTCUSDT">BTC/USD</option>
<option value="OANDA:XAUUSD">GOLD</option>
<option value="FX:GBPUSD">GBP/USD</option>
</select>
<button onclick="resetDemo()" style="padding:11px;background:#222;color:#666;border:1px solid #333;border-radius:10px;font-size:11px">RESET</button>
</div>
</div>
</div>

<div class="trades">
<div style="display:flex;justify-content:space-between"><b style="color:#ff8c42;font-size:13px">● Live Trades</b><small id="count" style="color:#666">0 open</small></div>
<div id="list"><p style="color:#444;text-align:center;padding:32px">No trades yet.<br>Tap BUY or SELL to start</p></div>
</div>

<div class="depModal" id="depModal">
<div class="depBox">
<h3 style="text-align:center">💳 Demo Deposit</h3>
<p style="text-align:center;color:#666;font-size:12px;margin-top:6px">Add demo funds instantly</p>
<input id="depAmt" class="inp" type="number" value="1000">
<button class="buyBtn" onclick="doDep()">ADD KSH →</button>
<button class="sellBtn" style="margin-top:10px" onclick="closeDep()">Cancel</button>
</div>
</div>

<script>
let bal = parseFloat(localStorage.getItem('ps_bal'));
if(isNaN(bal) || bal===0 || bal===null){ bal=1000; localStorage.setItem('ps_bal', bal); }
let stake = 1000;
let trades = JSON.parse(localStorage.getItem('ps_tr')||'[]');
let price = 1.12014;
let currentSym = "FX:EURUSD";

function updBal(){ document.getElementById('bal').innerText='KSH '+bal.toLocaleString(); localStorage.setItem('ps_bal',bal); }
updBal();
function openDep(){ document.getElementById('depModal').style.display='flex'; }
function closeDep(){ document.getElementById('depModal').style.display='none'; }
function doDep(){ let a=parseFloat(document.getElementById('depAmt').value)||0; if(a<100) return alert('Min 100'); bal+=a; updBal(); closeDep(); }
function setStake(v,el){ stake=v; document.querySelectorAll('.stakeBtn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
function changeSym(){
  currentSym = document.getElementById('symbolSel').value;
  document.getElementById('symTxt').innerText = document.getElementById('symbolSel').options[document.getElementById('symbolSel').selectedIndex].text;
  loadChart();
}
function loadChart(){
  // FIX - iframe inafanya kazi kwa github.io 100%
  let url = https://s.tradingview.com/widgetembed/?symbol=${currentSym}&interval=5&hidesidetoolbar=0&symboledit=1&saveimage=0&toolbarbg=000000&theme=Dark&style=1&timezone=Africa%2FNairobi&withdateranges=1&hideideas=1&studies=[];
  document.getElementById('tvFrame').src = url;
}
loadChart();

function trade(type){
  if(bal<stake){ openDep(); return; }
  bal-=stake; updBal();
  let t={ id:Date.now(), type, symbol:'EUR/USD', stake, entry:price, profit:0, time:new Date().toLocaleTimeString() };
  trades.push(t); save(); render();
}
function save(){ localStorage.setItem('ps_tr', JSON.stringify(trades)); }
function closeT(id){ let i=trades.findIndex(x=>x.id==id); if(i==-1) return; bal+=trades[i].stake+trades[i].profit; trades.splice(i,1); updBal(); save(); render(); }
function render(){
  document.getElementById('count').innerText = trades.length+' open';
  let c=document.getElementById('list');
  if(!trades.length){ c.innerHTML='<p style="color:#444;text-align:center;padding:32px">No trades yet.<br>Tap BUY or SELL to start</p>'; return; }
  c.innerHTML = trades.map(t=><div class="tradeItem"><div><b style="color:${t.type=='BUY'?'#00ff88':'#ff8c42'}">${t.type} ${t.symbol}</b><br><small style="color:#666">${t.time} • KSH ${t.stake}</small></div><div style="text-align:right"><b id="p-${t.id}" class="${t.profit>=0?'profit':'loss'}">${t.profit>=0?'+':''}${t.profit.toFixed(2)}</b><br><button onclick="closeT(${t.id})" style="margin-top:6px;padding:6px 12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-size:11px">CLOSE</button></div></div>).join('');
}
render();
function resetDemo(){ if(confirm('Reset demo?')){ bal=1000; trades=[]; localStorage.setItem('ps_bal',bal); localStorage.setItem('ps_tr','[]'); updBal(); render(); } }

setInterval(()=>{
  price+=(Math.random()-0.48)*0.00045;
  document.getElementById('priceTxt').innerText = price.toFixed(5);
  trades.forEach(t=>{
    let ch=(Math.random()-0.36)*(t.stake*0.07);
    t.profit+=ch;
    if(t.profit < -t.stake*0.9) t.profit = -t.stake*0.9;
    let el=document.getElementById('p-'+t.id);
    if(el){ el.innerText=(t.profit>=0?'+':'')+t.profit.toFixed(2); el.className=t.profit>=0?'profit':'loss'; }
  });
  if(trades.length) save();
},850);
</script>
</body>
</html>
